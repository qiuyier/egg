openapi: 3.1.0
info:
  title: Egg Inventory API
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /api/v1/items:
    post:
      operationId: createItem
      summary: 创建商品
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, name]
              properties:
                sku: {type: string, minLength: 1, maxLength: 64, examples: [SKU-001]}
                name: {type: string, minLength: 1, maxLength: 200, examples: [USB-C 线]}
      responses:
        '201':
          description: 商品已创建，初始库存为零
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          description: SKU 已存在，错误码为 duplicate_sku
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listItems
      summary: 按商品 ID 顺序分页查询
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}
        - in: query
          name: per_page
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: 当前页的商品列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [items, page, per_page]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/Item'
                          page: {type: integer}
                          per_page: {type: integer}
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/items/{id}/stock:
    patch:
      operationId: adjustStock
      summary: 增加或减少库存
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delta]
              properties:
                delta:
                  type: integer
                  format: int64
                  not: {const: 0}
                  description: 正数增加库存，负数减少库存
      responses:
        '200':
          description: 库存已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: 商品不存在，错误码为 item_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '409':
          description: 库存超出允许范围，错误码为 stock_out_of_range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    Item:
      type: object
      required: [id, sku, name, stock]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        sku: {type: string}
        name: {type: string}
        stock: {type: integer, format: int64, minimum: 0}
    Response:
      type: object
      required: [code, message, request_id]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
        trace_id: {type: string}
    ItemResponse:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Item'
  responses:
    InvalidRequest:
      description: JSON、请求参数或分页值无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
    InternalError:
      description: 服务内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
