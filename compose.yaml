# Development dependencies. Published ports are reachable only from this host.
name: egg
services:
  redis:
    image: redis:8.2-alpine
    ports:
      - "127.0.0.1:${EGG_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  mysql:
    image: mysql:8.0.34
    environment:
      MYSQL_DATABASE: egg
      MYSQL_USER: egg
      MYSQL_PASSWORD: egg
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "127.0.0.1:${EGG_MYSQL_PORT:-13306}:3306"
    healthcheck:
      test: ["CMD", "mysql", "-h127.0.0.1", "-uegg", "-pegg", "egg", "-e", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: egg
      POSTGRES_USER: egg
      POSTGRES_PASSWORD: egg
    ports:
      - "127.0.0.1:${EGG_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "egg", "-d", "egg"]
      interval: 2s
      timeout: 2s
      retries: 30
